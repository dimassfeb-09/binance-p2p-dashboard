<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Binance P2P — binance.dimassfeb.com</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{--mica:#f3f3f3;--card:#ffffff;--border:#e6e6e6;--accent:#0067c0}
  body{font-family:'Segoe UI Variable','Inter',Segoe UI,system-ui,sans-serif;background:var(--mica);color:#1a1a1a}
  .mica{backdrop-filter:blur(20px);background:rgba(243,243,243,0.85);border-bottom:1px solid var(--border)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,0.06),0 4px 12px rgba(0,0,0,0.04)}
  .btn-primary{background:var(--accent);color:#fff;border-radius:4px;padding:6px 14px;font-size:13px;font-weight:600}
  .btn-primary:hover{background:#005a9e}
  .select-win{background:#fff;border:1px solid #e5e5e5;border-radius:4px;padding:7px 10px;font-size:13px}
  .badge{font-size:11px;padding:2px 6px;border-radius:4px;background:#f0f0f0;border:1px solid #e6e6e6}
  th{font-weight:600;font-size:12px;letter-spacing:0.02em;text-transform:uppercase;color:#616161}
</style>
</head>
<body>
<header class="mica sticky top-0 z-10">
  <div class="max-w-[1120px] mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded bg-[#0067c0] grid place-items-center text-white text-[11px] font-bold">₮</div>
      <div>
        <div class="text-[15px] font-semibold leading-none">Binance P2P</div>
        <div class="text-xs text-[#616161]">binance.dimassfeb.com • USDT/IDR • WinUI 3</div>
      </div>
    </div>
    <a href="https://dimassfeb.com" class="text-xs text-[#0067c0] hover:underline">← dimassfeb.com</a>
  </div>
</header>

<main class="max-w-[1120px] mx-auto px-6 py-6">
  <div class="card p-4 mb-4 flex flex-wrap gap-3 items-center">
    <label class="text-xs text-[#616161]">Trade</label>
    <select id="tradeType" class="select-win">
      <option value="SELL" selected>Jual USDT (orang jual — lu beli) • termurah ↑</option>
      <option value="BUY">Beli USDT (orang beli — lu jual)</option>
    </select>
    <label class="text-xs text-[#616161] ml-2">Sort</label>
    <select id="sortBy" class="select-win">
      <option value="price-min" selected>Price ↑ then Min ↑</option>
      <option value="price">Price ↑ only</option>
      <option value="min">Min IDR ↑</option>
    </select>
    <button id="refresh" class="btn-primary ml-auto">Refresh</button>
    <span id="updated" class="text-xs text-[#616161]"></span>
  </div>

  <div class="card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-[#fbfbfb] border-b" style="border-color:var(--border)">
          <tr><th class="text-left p-3 pl-4 w-8">#</th><th class="text-right p-3">Price IDR</th><th class="text-left p-3">Merchant</th><th class="text-left p-3">Metode</th><th class="text-right p-3">Min IDR</th><th class="text-right p-3 pr-4">Max IDR</th></tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="6" class="p-8 text-center text-sm text-[#616161]">Memuat...</td></tr></tbody>
      </table>
    </div>
  </div>
  <p class="text-[11px] text-[#8a8a8a] mt-3">Sumber: p2p.binance.com/bapi via /api/p2p (unofficial) • Sorting: Price termurah di atas, lalu Min terendah • Refresh 30s • WinUI 3 Mica</p>
</main>

<script>
let cache=[];
function render(){
  const sort=document.getElementById('sortBy').value;
  let data=[...cache];
  if(sort==='price-min') data.sort((a,b)=> a.price!==b.price ? a.price-b.price : parseFloat(a.min)-parseFloat(b.min));
  else if(sort==='price') data.sort((a,b)=>a.price-b.price);
  else if(sort==='min') data.sort((a,b)=>parseFloat(a.min)-parseFloat(b.min));
  const tb=document.getElementById('tbody');
  tb.innerHTML=data.map((d,i)=>`<tr class="border-t hover:bg-[#f5f5f5]" style="border-color:#f0f0f0">
    <td class="p-3 pl-4 text-xs text-[#8a8a8a]">${i+1}</td>
    <td class="p-3 text-right font-mono text-[13px] font-semibold">Rp ${Number(d.price).toLocaleString('id-ID')}</td>
    <td class="p-3"><div class="text-[13px] font-medium">${d.merchant}</div><div class="text-[11px] text-[#616161]">${d.completion} • ${d.orders||0} orders</div></td>
    <td class="p-3"><span class="badge">${d.payMethods||'—'}</span></td>
    <td class="p-3 text-right font-mono text-xs">Rp ${Number(d.min).toLocaleString('id-ID')}</td>
    <td class="p-3 pr-4 text-right font-mono text-xs">Rp ${Number(d.max).toLocaleString('id-ID')}</td>
  </tr>`).join('') || `<tr><td colspan=6 class="p-8 text-center text-sm text-[#616161]">Tidak ada data</td></tr>`;
}
async function load(){
  const t=document.getElementById('tradeType').value;
  const r=await fetch(`/api/p2p?tradeType=${t}&rows=20`);
  const j=await r.json();
  cache=j.data||[]; render();
  document.getElementById('updated').textContent=new Date().toLocaleTimeString('id-ID')+' • '+j.tradeType+' • '+cache.length+' iklan';
}
document.getElementById('tradeType').addEventListener('change',load);
document.getElementById('sortBy').addEventListener('change',render);
document.getElementById('refresh').addEventListener('click',load);
load(); setInterval(load,30000);
</script>
</body>
</html>
